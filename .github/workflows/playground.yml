name: playground

on:
  pull_request:
  push:

jobs:
  playground:
    name: playground (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: C++ toolchain
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y cmake g++
          elif ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi

      - name: Python packages
        run: python -m pip install -r tools/playground/requirements.txt

      - name: Run the playground
        run: python tools/playground/run.py

      - name: Upload plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playground-${{ matrix.os }}
          path: tools/playground/out/
          if-no-files-found: warn
